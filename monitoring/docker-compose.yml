services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: lgtm
    ports:
      # Grafana
      - "3000:3000"
      # OpenTelemetry gRPC
      # - "4317:4317"
      # OpenTelemetry HTTP
      # - "4318:4318"
      # Prometheus
      - "9090:9090"
      # Tempo
      - "3200:3200"
      # Loki
      - "3100:3100"
      # Pyroscope
      - "4040:4040"
    volumes:
      # Mount local data directory to persist data
      - ./data/lgtm:/data
    # environment:
    # Optional: Enable logging for troubleshooting
    # ENABLE_LOGS_ALL: "true"
    # ENABLE_LOGS_GRAFANA: "true"
    # ENABLE_LOGS_LOKI: "true"
    # ENABLE_LOGS_PROMETHEUS: "true"
    # ENABLE_LOGS_TEMPO: "true"
    # ENABLE_LOGS_PYROSCOPE: "true"
    # ENABLE_LOGS_OTELCOL: "true"

    # Optional: Send data to external vendors
    # OTEL_EXPORTER_OTLP_ENDPOINT: "https://your-endpoint.com"
    # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer your-token"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      # Alloy UI
      - "12345:12345"
      # OpenTelemetry gRPC (for receiving traces/logs from host)
      - "4317:4317"
    volumes:
      # Mount the Alloy configuration
      - ./config.alloy:/etc/alloy/config.alloy
      # Mount the logs directory (read-only)
      - ../Logs:/logs:ro
      # Persist Alloy's positions file for log rotation handling
      - ./data/alloy:/var/lib/alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    environment:
      # Enable debug logging if needed
      # ALLOY_LOG_LEVEL: debug
      ALLOY_LOG_LEVEL: info
    depends_on:
      - lgtm
    restart: unless-stopped
